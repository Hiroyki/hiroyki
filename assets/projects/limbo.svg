<svg xmlns="http://www.w3.org/2000/svg" width="390" height="222" viewBox="0 0 390 222" role="img" aria-label="Limbo">
  <title>Limbo</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7768e"/><stop offset="1" stop-color="#e03a24"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f7768e" stop-opacity=".28"/><stop offset="1" stop-color="#f7768e" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="390" height="222" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif; } .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, Menlo, monospace; }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.2s; }
      @keyframes twinkle { 0%,100% { opacity: .9; } 50% { opacity: .15; } }
      .pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.8); opacity: 0; } }

      .shine { animation: shine 6s ease-in-out infinite; }
      @keyframes shine { 0% { transform: translateX(-260px) skewX(-20deg); } 40%,100% { transform: translateX(550px) skewX(-20deg); } }
      .lid { animation: lid 4.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes lid { 0%,44%,50%,90%,100% { transform: scaleY(1); } 47% { transform: scaleY(.06); } }
      .look { animation: look 9s ease-in-out infinite; }
      @keyframes look { 0%,18%,100% { transform: translate(0,0); } 26%,42% { transform: translate(2.2px,.6px); } 52%,68% { transform: translate(-2.2px,.4px); } 78%,88% { transform: translate(.6px,-1.2px); } }
      @media (prefers-reduced-motion: reduce) { .lid, .look { animation: none; } }
      .bob { animation: bob 3.5s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="390" height="222" fill="#1a1b27"/>
    <circle cx="350" cy="10" r="150" fill="url(#gl)"><animate attributeName="r" values="130;165;130" dur="6s" repeatCount="indefinite"/></circle>
    <rect class="shine" x="0" y="0" width="180" height="222" fill="url(#shine)"/>
    <rect width="390" height="4" fill="url(#g)"/>
    <g class="bob"><image x="12" y="12" width="74" height="74" href="data:image/png;base64,"/><g class="look"><g class="lid"><ellipse cx="43.42" cy="41.98" rx="3" ry="3.1" fill="#fff"/><ellipse cx="53.08" cy="41.98" rx="3" ry="3.1" fill="#fff"/></g></g></g>
    <text x="92" y="48" class="sans" font-size="24" font-weight="800" fill="#c0caf5">Limbo</text>
    <rect x="92" y="60" width="82" height="22" rx="11" fill="#9ece6a" fill-opacity=".12" stroke="#9ece6a" stroke-opacity=".45"/>
    <circle class="pulse" cx="106" cy="71" r="3.5" fill="#9ece6a"/><circle cx="106" cy="71" r="3.5" fill="#9ece6a"/>
    <text x="116" y="75" class="sans" font-size="10" font-weight="700" letter-spacing="1" fill="#9ece6a">PUBLIC</text>
    <text x="24" y="124" class="sans" font-size="15.5" fill="#a9b1d6">A Chrome extension that eats your</text><text x="24" y="147" class="sans" font-size="15.5" fill="#a9b1d6">browsing history, with time to undo.</text><rect x="24" y="172" width="96" height="26" rx="13" fill="#f7768e" fill-opacity=".12" stroke="#f7768e" stroke-opacity=".4"/><text x="72.0" y="189.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#f7768e">JavaScript</text><rect x="127" y="172" width="70" height="26" rx="13" fill="#f7768e" fill-opacity=".12" stroke="#f7768e" stroke-opacity=".4"/><text x="162.0" y="189.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#f7768e">Chrome</text><rect x="204" y="172" width="66" height="26" rx="13" fill="#f7768e" fill-opacity=".12" stroke="#f7768e" stroke-opacity=".4"/><text x="237.0" y="189.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#f7768e">WebGL</text><rect x="277" y="172" width="72" height="26" rx="13" fill="#f7768e" fill-opacity=".12" stroke="#f7768e" stroke-opacity=".4"/><text x="313.0" y="189.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#f7768e">Privacy</text>
  </g>
  <rect x=".5" y=".5" width="389" height="221" rx="18" fill="none" stroke="#f7768e" stroke-opacity=".3"/>
</svg>
