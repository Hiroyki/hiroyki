<svg xmlns="http://www.w3.org/2000/svg" width="390" height="222" viewBox="0 0 390 222" role="img" aria-label="Play">
  <title>Play</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa5ce"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e6e9f5" stop-opacity=".16"/><stop offset="1" stop-color="#e6e9f5" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="390" height="222" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif; } .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, Menlo, monospace; }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.2s; }
      @keyframes twinkle { 0%,100% { opacity: .9; } 50% { opacity: .15; } }
      .pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.8); opacity: 0; } }

      .shine { animation: shine 6s ease-in-out infinite; }
      @keyframes shine { 0% { transform: translateX(-260px) skewX(-20deg); } 40%,100% { transform: translateX(550px) skewX(-20deg); } }
      .tri { transform-box: fill-box; transform-origin: 34% 50%; animation: tri 6s cubic-bezier(.22,.8,.24,1) infinite; }
      @keyframes tri { 0%,70%,100% { transform: rotate(0); } 88% { transform: rotate(360deg); } 99.9% { transform: rotate(360deg); } }
      .seek { animation: seek 12s linear infinite; }
      @keyframes seek { 0% { transform: translateX(-390px); } 92%,100% { transform: translateX(0); } }
      @media (prefers-reduced-motion: reduce) { .tri, .seek, .shine, .bob, .pulse { animation: none; } }
      .bob { animation: bob 3.5s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="390" height="222" fill="#1a1b27"/>
    <circle cx="350" cy="10" r="150" fill="url(#gl)"><animate attributeName="r" values="130;165;130" dur="6s" repeatCount="indefinite"/></circle>
    <rect class="shine" x="0" y="0" width="180" height="222" fill="url(#shine)"/>
    <rect width="390" height="4" fill="url(#g)" fill-opacity=".25"/><rect class="seek" width="390" height="4" fill="url(#g)"/>
    <g class="bob"><g transform="translate(22 22) scale(.84375)"><rect x=".5" y=".5" width="63" height="63" rx="14" fill="#000" stroke="#fff" stroke-opacity=".16"/><g fill="#fff"><path transform="translate(3.60 10.40) scale(0.2722) translate(-14 -47)" d="M14 47H101C116 47 124 57 124 71.5S116 96 101 96H36V119H14V79H96.5A7.5 7.5 0 0 0 96.5 64H33C22 64 14 57 14 47Z"/><path transform="translate(36.72 10.40) scale(0.2722) translate(-134 -47)" d="M134 47H155V93A8 8 0 0 0 163 101H221V119H155A21 21 0 0 1 134 98Z"/><g class="tri"><path transform="translate(3.60 34.00) scale(0.2722) translate(-235 -47)" d="M235 47L311 83L235 119Z"/></g><path transform="translate(27.19 34.00) scale(0.2722) translate(-314 -47)" d="M314 47H343L374 78L405 47H436L364 119H334L360 93Z"/></g></g></g>
    <text x="92" y="48" class="sans" font-size="24" font-weight="800" fill="#c0caf5">Play</text>
    <rect x="92" y="60" width="82" height="22" rx="11" fill="#9ece6a" fill-opacity=".12" stroke="#9ece6a" stroke-opacity=".45"/>
    <circle class="pulse" cx="106" cy="71" r="3.5" fill="#9ece6a"/><circle cx="106" cy="71" r="3.5" fill="#9ece6a"/>
    <text x="116" y="75" class="sans" font-size="10" font-weight="700" letter-spacing="1" fill="#9ece6a">PUBLIC</text>
    <text x="24" y="124" class="sans" font-size="15.5" fill="#a9b1d6">A personal YouTube player for</text><text x="24" y="147" class="sans" font-size="15.5" fill="#a9b1d6">Windows, without the ads.</text><rect x="24" y="172" width="96" height="26" rx="13" fill="#e6e9f5" fill-opacity=".1" stroke="#e6e9f5" stroke-opacity=".35"/><text x="72.0" y="189.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#e6e9f5">JavaScript</text><rect x="127" y="172" width="46" height="26" rx="13" fill="#e6e9f5" fill-opacity=".1" stroke="#e6e9f5" stroke-opacity=".35"/><text x="150.0" y="189.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#e6e9f5">C#</text><rect x="180" y="172" width="78" height="26" rx="13" fill="#e6e9f5" fill-opacity=".1" stroke="#e6e9f5" stroke-opacity=".35"/><text x="219.0" y="189.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#e6e9f5">Windows</text><rect x="265" y="172" width="86" height="26" rx="13" fill="#e6e9f5" fill-opacity=".1" stroke="#e6e9f5" stroke-opacity=".35"/><text x="308.0" y="189.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#e6e9f5">WebView2</text>
  </g>
  <rect x=".5" y=".5" width="389" height="221" rx="18" fill="none" stroke="#e6e9f5" stroke-opacity=".3"/>
</svg>
